<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de presentes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff;--olive:#8b947f;--olive-dark:#667057;--olive-soft:#eef1e9;--green:#7cc63d;--gold:#d3bb6c;--text:#6e6f68;--muted:#8b9086;--line:#e5e7df;--shadow:0 14px 34px rgba(84,89,74,.14)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:Georgia,"Times New Roman",serif}
.wrap{width:min(100%,900px);margin:auto;padding:34px 16px 56px}.hero{text-align:center;margin-bottom:30px}
.hero .eyebrow{font-family:"Segoe Script","Brush Script MT",cursive;color:var(--gold);font-size:34px}
.hero h1{margin:0;font-family:"Segoe Script","Brush Script MT",cursive;color:var(--olive-dark);font-weight:400;font-size:clamp(36px,8vw,60px)}
.hero p{margin:12px auto 0;max-width:620px;color:var(--muted);font-size:16px;line-height:1.6;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.room-card{background:linear-gradient(180deg,#fbfaf7,#f7f6f2);border:1px solid #ecebe5;border-radius:28px;padding:16px 14px 14px;box-shadow:var(--shadow)}
.room-card h2{margin:0 0 12px;text-align:center;color:var(--gold);font-family:"Segoe Script","Brush Script MT",cursive;font-size:34px;font-weight:400}
.items-shell{background:#fff;border:1px solid #dfe2d8;border-radius:22px;overflow:hidden}
.gift-item{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;text-align:left;padding:18px 16px;color:var(--text);cursor:pointer;font-family:Georgia,"Times New Roman",serif}
.gift-item:last-child{border-bottom:0}.gift-item[disabled]{cursor:default}.check{width:28px;height:28px;border:2px solid var(--olive);border-radius:6px;display:grid;place-items:center;background:#fff}
.heart{color:#fff;opacity:0}.gift-name{font-size:17px;line-height:1.35}.status{min-width:110px;text-align:center;font:11px Arial,sans-serif;letter-spacing:2px;color:#fff;background:var(--green);border-radius:999px;padding:10px 14px;white-space:nowrap}
.gift-item.reserved .check{background:var(--olive);border-color:var(--olive)}.gift-item.reserved .heart{opacity:1}.gift-item.reserved .gift-name{text-decoration:line-through;color:#9c9d98}.gift-item.reserved .status{background:var(--olive)}
.modal-backdrop{position:fixed;inset:0;background:rgba(56,59,51,.34);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(4px)}.modal-backdrop.open{display:flex}
.modal{position:relative;width:min(100%,520px);background:#fff;border-radius:26px;padding:28px 24px 24px;box-shadow:0 28px 70px rgba(44,47,40,.24);border:1px solid #eeefe9}
.modal-close{position:absolute;top:14px;right:16px;border:0;background:transparent;color:#81867b;font-size:32px;cursor:pointer}
.modal-kicker{text-align:center;font:12px Arial,sans-serif;letter-spacing:4px;color:#7d8278;margin-bottom:16px}.selected-name{display:block;text-align:center;color:#686b63;font-size:26px;line-height:1.25;margin-bottom:16px}
.modal-copy{text-align:center;color:#8b9086;font-style:italic;font-size:18px;line-height:1.5;margin:0 0 22px}label{display:block;font:12px Arial,sans-serif;letter-spacing:3px;color:#777c72;margin-bottom:9px}
input{width:100%;height:68px;border:1px solid #d6d9d0;border-radius:18px;padding:0 20px;font:18px Georgia,serif;color:#686b63;outline:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.btn{height:58px;border-radius:999px;font:18px Georgia,serif;cursor:pointer}.cancel{border:1px solid #d6d9d0;background:#fff;color:#7d8178}.confirm{border:1px solid var(--olive);background:var(--olive);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--olive-dark);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading,.error{text-align:center;padding:40px;color:var(--muted);font-style:italic}
@media(max-width:720px){.grid{grid-template-columns:1fr}.gift-item{grid-template-columns:34px 1fr auto;padding:16px 12px;gap:10px}.gift-name{font-size:16px}.status{min-width:96px;font-size:10px;letter-spacing:1.5px;padding:9px 11px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="eyebrow">nosso lar</div><h1 id="title">Lista de presentes</h1><p>Escolha com carinho um presente disponível. Ao confirmar, ele ficará marcado como reservado.</p></header>
<div id="content" class="loading">Carregando lista...</div>
</main>
<div class="modal-backdrop" id="modal"><div class="modal">
<button class="modal-close" id="closeBtn">×</button><div class="modal-kicker">OBRIGADA POR ESCOLHER</div>
<span class="selected-name" id="selectedGift"></span><p class="modal-copy">Preencha com o seu nome para confirmar.</p>
<label>SEU NOME</label><input id="guestName" autocomplete="name" placeholder="Digite seu nome">
<div class="actions"><button class="btn cancel" id="cancelBtn">Cancelar</button><button class="btn confirm" id="confirmBtn">Confirmar</button></div>
</div></div><div class="toast" id="toast"></div>
<script>
const db=supabase.createClient('https://puevsrsipzzvkapqicex.supabase.co','sb_publishable_wu_JCjbkhrtquuNk7KkPfg_Z7ofeQJ_');
const slug=new URLSearchParams(location.search).get('evento')||'cha-casa-nova-teste';
let currentId=null; const content=document.getElementById('content'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function shadeColor(hex,percent){
  const n=parseInt(hex.replace('#',''),16);
  const amt=Math.round(2.55*percent);
  const r=Math.max(0,Math.min(255,(n>>16)+amt));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  const b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
async function load(){
 const {data,error}=await db.rpc('lista_publica',{p_slug:slug});
 if(error||!data?.length){content.className='error';content.textContent='Esta lista não foi encontrada.';return}
 document.getElementById('title').textContent=data[0].evento_nome||'Lista de presentes';
 const color=data[0].cor_principal||'#8b947f';
 document.documentElement.style.setProperty('--olive', color);
 document.documentElement.style.setProperty('--olive-dark', shadeColor(color,-18));
 document.documentElement.style.setProperty('--gold', color);
 const grouped={};data.forEach(x=>{if(!grouped[x.comodo])grouped[x.comodo]=[];grouped[x.comodo].push(x)});
 content.className='grid';content.innerHTML=Object.entries(grouped).map(([room,items])=>`<section class="room-card"><h2>${esc(room)}</h2><div class="items-shell">${items.map(g=>`<button class="gift-item ${g.reservado?'reserved':''}" data-id="${g.presente_id}" data-name="${esc(g.presente)}" ${g.reservado?'disabled':''}><span class="check"><span class="heart">♥</span></span><span class="gift-name">${esc(g.presente)}</span><span class="status">${g.reservado?'RESERVADO':'DISPONÍVEL'}</span></button>`).join('')}</div></section>`).join('');
 document.querySelectorAll('.gift-item:not(.reserved)').forEach(b=>b.addEventListener('click',()=>{currentId=Number(b.dataset.id);document.getElementById('selectedGift').textContent=b.dataset.name;document.getElementById('guestName').value='';modal.classList.add('open')}));
}
function close(){modal.classList.remove('open');currentId=null}document.getElementById('closeBtn').onclick=close;document.getElementById('cancelBtn').onclick=close;
document.getElementById('confirmBtn').onclick=async()=>{const name=document.getElementById('guestName').value.trim();if(!currentId||name.length<2)return document.getElementById('guestName').focus();const btn=document.getElementById('confirmBtn');btn.disabled=true;btn.textContent='Confirmando...';const {data,error}=await db.rpc('reservar_presente',{p_presente_id:currentId,p_nome:name});btn.disabled=false;btn.textContent='Confirmar';if(error) return showToast('Não foi possível confirmar agora.');if(!data?.ok){showToast(data?.erro||'Este presente já foi reservado.');close();return load()}close();showToast('Presente reservado ♥');load()};
db.channel('lista-publica').on('postgres_changes',{event:'UPDATE',schema:'public',table:'presentes'},()=>load()).subscribe();load();
</script>
</body>
</html>
