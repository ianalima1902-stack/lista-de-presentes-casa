<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel | Listas de presentes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f6f7f3;--card:#fff;--olive:#8b947f;--olive-dark:#667057;--olive-soft:#eef1e9;
  --gold:#d3bb6c;--text:#4f5349;--muted:#8b8f86;--line:#e2e5dc;--danger:#a75f5f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
.shell{width:min(100%,1050px);margin:auto;padding:24px 14px 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(75,82,66,.08)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1,h2,h3{font-weight:400;color:var(--olive-dark)}
h1{margin:0;font-size:clamp(29px,6vw,43px)}
.sub{color:var(--muted);margin:6px 0 0;font-style:italic}
.btn{border:0;border-radius:999px;min-height:44px;padding:0 17px;cursor:pointer;font-family:Georgia,"Times New Roman",serif;font-size:14px}
.btn.primary{background:var(--olive-dark);color:#fff}
.btn.soft{background:var(--olive-soft);color:var(--olive-dark)}
.btn.ghost{background:#fff;color:var(--olive-dark);border:1px solid var(--line)}
.btn.danger{background:#f7eded;color:var(--danger)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.login{max-width:520px;margin:8vh auto 0;padding:24px}
label{display:block;margin:13px 0 6px;font:12px Arial,sans-serif;letter-spacing:1.5px;color:#777c72}
input{width:100%;height:50px;border:1px solid #d5d9cf;border-radius:14px;padding:0 14px;font-size:16px;color:var(--text);background:#fff;outline:none}
input:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(139,148,127,.12)}
.login .actions{margin-top:18px}
.notice{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}
.screen{display:none}
.screen.active{display:block}
.list-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.event-card{padding:18px}
.event-card h3{margin:0 0 5px;font-size:24px}
.event-card .client{color:var(--muted);font-style:italic;margin-bottom:14px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 15px}
.mini{background:#fafbf8;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}
.mini strong{display:block;color:var(--olive-dark);font-size:20px}
.mini span{font:9px Arial,sans-serif;letter-spacing:1px;color:var(--muted)}
.new-event{padding:18px;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end}
.manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.manager-title h2{margin:0;font-size:30px}
.links-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.link-card{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fafbf8}
.link-card b{display:block;color:var(--olive-dark);margin-bottom:6px}
.link-card code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#777;font-size:11px;margin-bottom:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{padding:15px;text-align:center}
.stat strong{display:block;font-size:26px;color:var(--olive-dark)}
.stat span{font:10px Arial,sans-serif;letter-spacing:1px;color:var(--muted)}
.add-box{padding:18px;margin-bottom:18px}
.add-grid{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:end}
.room{margin-bottom:15px;overflow:hidden}
.room-title{padding:13px 15px;font-size:22px;color:var(--olive-dark);background:#fafbf7;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item-name{font-size:16px}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;margin-left:6px;border-radius:999px;padding:4px 8px;font:9px Arial,sans-serif;letter-spacing:1px}
.available{background:#edf6e7;color:#5e8b43}
.reserved{background:var(--olive-soft);color:var(--olive-dark)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(15px);background:var(--olive-dark);color:#fff;padding:10px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media(max-width:760px){
  .event-grid{grid-template-columns:1fr}
  .form-grid,.add-grid,.links-box{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .manager-head,.list-header{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="shell">

<section id="loginCard" class="card login">
  <h2>Painel administrativo</h2>
  <p class="sub">Gerencie todas as suas listas em um só lugar.</p>
  <label>E-MAIL</label>
  <input id="email" type="email" value="ianasousa1902@gmail.com" readonly>
  <label>SENHA</label>
  <input id="password" type="password" placeholder="Digite sua senha">
  <div class="actions">
    <button class="btn primary" id="loginBtn">Entrar</button>
    <button class="btn soft" id="signupBtn">Criar meu acesso</button>
  </div>
  <p class="notice">Use “Criar meu acesso” apenas na primeira vez.</p>
</section>

<section id="listsScreen" class="screen">
  <div class="topbar">
    <div>
      <h1>Minhas listas</h1>
      <p class="sub">Escolha uma lista para gerenciar ou crie uma nova.</p>
    </div>
    <button class="btn ghost" id="logoutBtn">Sair</button>
  </div>

  <section class="card new-event">
    <h3 style="margin:0 0 12px">+ Nova lista</h3>
    <div class="form-grid">
      <div>
        <label>NOME DO EVENTO</label>
        <input id="eventName" placeholder="Ex.: Casamento Ana & José">
      </div>
      <div>
        <label>CLIENTE / CASAL</label>
        <input id="clientName" placeholder="Ex.: Ana & José">
      </div>
      <div>
        <label>LINK</label>
        <input id="eventSlug" placeholder="ana-e-jose">
      </div>
      <button class="btn primary" id="createEventBtn">Criar lista</button>
    </div>
  </section>

  <div id="eventsGrid" class="event-grid"></div>
</section>

<section id="managerScreen" class="screen">
  <div class="manager-head">
    <div class="manager-title">
      <button class="btn ghost small" id="backBtn">← Minhas listas</button>
      <h2 id="managerEventName" style="margin-top:12px"></h2>
      <p id="managerClientName" class="sub"></p>
    </div>
    <div class="actions">
      <button class="btn ghost small" id="editEventBtn">Editar lista</button>
      <button class="btn danger small" id="deleteEventBtn">Excluir lista</button>
    </div>
  </div>

  <div class="links-box">
    <div class="link-card">
      <b>Link público</b>
      <code id="publicLink"></code>
      <div class="actions">
        <button class="btn soft small" id="copyPublicBtn">Copiar</button>
        <button class="btn ghost small" id="openPublicBtn">Abrir</button>
      </div>
    </div>
    <div class="link-card">
      <b>Acompanhamento da cliente</b>
      <code id="clientLink"></code>
      <div class="actions">
        <button class="btn soft small" id="copyClientBtn">Copiar</button>
        <button class="btn ghost small" id="openClientBtn">Abrir</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="card stat"><strong id="totalCount">0</strong><span>TOTAL</span></div>
    <div class="card stat"><strong id="availableCount">0</strong><span>DISPONÍVEIS</span></div>
    <div class="card stat"><strong id="reservedCount">0</strong><span>RESERVADOS</span></div>
  </div>

  <section class="card add-box">
    <h3 style="margin:0 0 12px">Adicionar presente</h3>
    <div class="add-grid">
      <div>
        <label>CÔMODO</label>
        <input id="newRoom" placeholder="Ex.: Cozinha">
      </div>
      <div>
        <label>PRESENTE</label>
        <input id="newGift" placeholder="Ex.: Jogo de panelas">
      </div>
      <button class="btn primary" id="addGiftBtn">Adicionar</button>
    </div>
  </section>

  <div id="giftList"></div>
</section>
</main>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://puevsrsipzzvkapqicex.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wu_JCjbkhrtquuNk7KkPfg_Z7ofeQJ_';
const BASE_URL = 'https://listas.umconviteso.com.br';
const ADMIN_EMAIL = 'ianasousa1902@gmail.com';

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentEvent = null;
let allEvents = [];
let allGifts = [];
let allReservations = [];

const loginCard=document.getElementById('loginCard');
const listsScreen=document.getElementById('listsScreen');
const managerScreen=document.getElementById('managerScreen');
const toast=document.getElementById('toast');

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
function slugify(v){
  return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function esc(v){
  return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#039;");
}
function showScreen(which){
  listsScreen.classList.remove('active');
  managerScreen.classList.remove('active');
  if(which==='lists') listsScreen.classList.add('active');
  if(which==='manager') managerScreen.classList.add('active');
}

document.getElementById('eventName').addEventListener('input',e=>{
  const slug=document.getElementById('eventSlug');
  if(!slug.dataset.manual) slug.value=slugify(e.target.value);
});
document.getElementById('eventSlug').addEventListener('input',e=>{
  e.target.dataset.manual='1';
  e.target.value=slugify(e.target.value);
});

document.getElementById('signupBtn').addEventListener('click',async()=>{
  const password=document.getElementById('password').value.trim();
  if(password.length<6) return showToast('Use uma senha com pelo menos 6 caracteres.');
  const {error}=await db.auth.signUp({email:ADMIN_EMAIL,password});
  showToast(error?error.message:'Acesso criado. Confira seu e-mail se solicitado.');
});

document.getElementById('loginBtn').addEventListener('click',async()=>{
  const password=document.getElementById('password').value.trim();
  const {data,error}=await db.auth.signInWithPassword({email:ADMIN_EMAIL,password});
  if(error) return showToast('E-mail ou senha inválidos.');
  if(data.user?.email!==ADMIN_EMAIL){await db.auth.signOut();return showToast('Acesso não autorizado.');}
  loginCard.style.display='none';
  showScreen('lists');
  await loadEverything();
});

document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await db.auth.signOut(); location.reload();
});

async function loadEverything(){
  const [ev,gf,rs]=await Promise.all([
    db.from('eventos').select('*').order('id',{ascending:true}),
    db.from('presentes').select('*').order('id',{ascending:true}),
    db.from('reservas').select('*')
  ]);
  if(ev.error||gf.error||rs.error) return showToast('Não foi possível carregar o painel.');
  allEvents=ev.data||[]; allGifts=gf.data||[]; allReservations=rs.data||[];
  renderEvents();
  if(currentEvent){
    currentEvent=allEvents.find(e=>e.id===currentEvent.id)||null;
    if(currentEvent) renderManager();
  }
}

function renderEvents(){
  const grid=document.getElementById('eventsGrid');
  if(!allEvents.length){grid.innerHTML='<div class="card empty">Nenhuma lista criada ainda.</div>';return;}
  grid.innerHTML=allEvents.map(ev=>{
    const gifts=allGifts.filter(g=>g.evento_id===ev.id);
    const reserved=gifts.filter(g=>g.reservado).length;
    return `<article class="card event-card">
      <h3>${esc(ev.nome)}</h3>
      <div class="client">${esc(ev.cliente_nome||'Sem nome de cliente')}</div>
      <div class="mini-stats">
        <div class="mini"><strong>${gifts.length}</strong><span>TOTAL</span></div>
        <div class="mini"><strong>${reserved}</strong><span>RESERVADOS</span></div>
        <div class="mini"><strong>${gifts.length-reserved}</strong><span>DISPONÍVEIS</span></div>
      </div>
      <div class="actions">
        <button class="btn primary small" onclick="manageEvent(${ev.id})">Gerenciar</button>
        <button class="btn ghost small" onclick="openUrl('${BASE_URL}/?evento=${encodeURIComponent(ev.slug)}')">Abrir lista</button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('createEventBtn').addEventListener('click',async()=>{
  const nome=document.getElementById('eventName').value.trim();
  const cliente_nome=document.getElementById('clientName').value.trim();
  const slug=slugify(document.getElementById('eventSlug').value.trim()||nome);
  if(!nome||!slug) return showToast('Informe o nome do evento.');
  const {data,error}=await db.from('eventos').insert({nome,cliente_nome,slug}).select().single();
  if(error) return showToast(error.code==='23505'?'Esse link já está em uso.':'Não foi possível criar a lista.');
  document.getElementById('eventName').value='';
  document.getElementById('clientName').value='';
  document.getElementById('eventSlug').value='';
  document.getElementById('eventSlug').dataset.manual='';
  showToast('Nova lista criada.');
  await loadEverything();
  if(data) manageEvent(data.id);
});

window.manageEvent=function(id){
  currentEvent=allEvents.find(e=>e.id===id);
  if(!currentEvent) return;
  showScreen('manager');
  renderManager();
};
window.openUrl=function(url){window.open(url,'_blank','noopener');};

document.getElementById('backBtn').addEventListener('click',()=>{currentEvent=null;showScreen('lists');renderEvents();});

function renderManager(){
  const ev=currentEvent;
  document.getElementById('managerEventName').textContent=ev.nome;
  document.getElementById('managerClientName').textContent=ev.cliente_nome||'';
  const publicUrl=`${BASE_URL}/?evento=${encodeURIComponent(ev.slug)}`;
  const clientUrl=`${BASE_URL}/cliente.html?chave=${ev.cliente_token}`;
  document.getElementById('publicLink').textContent=publicUrl;
  document.getElementById('clientLink').textContent=clientUrl;

  const gifts=allGifts.filter(g=>g.evento_id===ev.id);
  const reservations=new Map(allReservations.map(r=>[r.presente_id,r]));
  document.getElementById('totalCount').textContent=gifts.length;
  document.getElementById('reservedCount').textContent=gifts.filter(g=>g.reservado).length;
  document.getElementById('availableCount').textContent=gifts.filter(g=>!g.reservado).length;

  const grouped={};
  gifts.forEach(g=>{if(!grouped[g.comodo]) grouped[g.comodo]=[]; grouped[g.comodo].push(g);});
  const el=document.getElementById('giftList');
  const rooms=Object.keys(grouped);
  if(!rooms.length){el.innerHTML='<div class="card empty">Esta lista ainda não tem presentes.</div>';return;}
  el.innerHTML=rooms.map(room=>`
    <section class="card room">
      <div class="room-title">${esc(room)}</div>
      ${grouped[room].map(g=>{
        const r=reservations.get(g.id);
        return `<div class="item">
          <div>
            <div class="item-name">${esc(g.presente)}
              <span class="badge ${g.reservado?'reserved':'available'}">${g.reservado?'RESERVADO':'DISPONÍVEL'}</span>
            </div>
            ${r?`<div class="meta">Reservado por: <strong>${esc(r.reservado_por)}</strong></div>`:''}
          </div>
          <div class="actions">
            ${g.reservado?`<button class="btn soft small" onclick="releaseGift(${g.id})">Liberar</button>`:''}
            <button class="btn ghost small" onclick="editGift(${g.id},'${encodeURIComponent(g.comodo)}','${encodeURIComponent(g.presente)}')">Editar</button>
            <button class="btn danger small" onclick="deleteGift(${g.id})">Excluir</button>
          </div>
        </div>`;
      }).join('')}
    </section>`).join('');
}

document.getElementById('addGiftBtn').addEventListener('click',async()=>{
  if(!currentEvent) return;
  const comodo=document.getElementById('newRoom').value.trim();
  const presente=document.getElementById('newGift').value.trim();
  if(!comodo||!presente) return showToast('Preencha o cômodo e o presente.');
  const {error}=await db.from('presentes').insert({evento_id:currentEvent.id,comodo,presente});
  if(error) return showToast(error.code==='23505'?'Esse presente já existe nesse cômodo.':'Não foi possível adicionar.');
  document.getElementById('newGift').value='';
  showToast('Presente adicionado.');
  await loadEverything();
});

window.releaseGift=async function(id){
  const d=await db.from('reservas').delete().eq('presente_id',id);
  if(d.error) return showToast('Não foi possível liberar.');
  const u=await db.from('presentes').update({reservado:false,reservado_em:null}).eq('id',id);
  if(u.error) return showToast('Não foi possível liberar.');
  showToast('Presente liberado.'); await loadEverything();
};

window.editGift=async function(id,roomEnc,giftEnc){
  const room=prompt('Cômodo:',decodeURIComponent(roomEnc)); if(room===null)return;
  const gift=prompt('Nome do presente:',decodeURIComponent(giftEnc)); if(gift===null)return;
  if(!room.trim()||!gift.trim()) return showToast('Os campos não podem ficar vazios.');
  const {error}=await db.from('presentes').update({comodo:room.trim(),presente:gift.trim()}).eq('id',id);
  if(error) return showToast('Não foi possível editar.');
  showToast('Presente atualizado.'); await loadEverything();
};

window.deleteGift=async function(id){
  if(!confirm('Excluir este presente?'))return;
  const {error}=await db.from('presentes').delete().eq('id',id);
  if(error)return showToast('Não foi possível excluir.');
  showToast('Presente excluído.'); await loadEverything();
};

document.getElementById('editEventBtn').addEventListener('click',async()=>{
  if(!currentEvent)return;
  const nome=prompt('Nome do evento:',currentEvent.nome); if(nome===null)return;
  const cliente=prompt('Nome da cliente/casal:',currentEvent.cliente_nome||''); if(cliente===null)return;
  const slug=prompt('Link da lista:',currentEvent.slug); if(slug===null)return;
  const newSlug=slugify(slug);
  if(!nome.trim()||!newSlug)return showToast('Nome e link são obrigatórios.');
  const {error}=await db.from('eventos').update({nome:nome.trim(),cliente_nome:cliente.trim(),slug:newSlug}).eq('id',currentEvent.id);
  if(error)return showToast(error.code==='23505'?'Esse link já está em uso.':'Não foi possível editar a lista.');
  showToast('Lista atualizada.'); await loadEverything();
});

document.getElementById('deleteEventBtn').addEventListener('click',async()=>{
  if(!currentEvent)return;
  if(!confirm('Excluir esta lista inteira, incluindo presentes e reservas?'))return;
  const {error}=await db.from('eventos').delete().eq('id',currentEvent.id);
  if(error)return showToast('Não foi possível excluir a lista.');
  currentEvent=null; showScreen('lists'); showToast('Lista excluída.'); await loadEverything();
});

function copyText(v){navigator.clipboard.writeText(v).then(()=>showToast('Link copiado.'));}
document.getElementById('copyPublicBtn').addEventListener('click',()=>copyText(document.getElementById('publicLink').textContent));
document.getElementById('copyClientBtn').addEventListener('click',()=>copyText(document.getElementById('clientLink').textContent));
document.getElementById('openPublicBtn').addEventListener('click',()=>openUrl(document.getElementById('publicLink').textContent));
document.getElementById('openClientBtn').addEventListener('click',()=>openUrl(document.getElementById('clientLink').textContent));

db.channel('admin-multilistas')
.on('postgres_changes',{event:'*',schema:'public',table:'presentes'},()=>loadEverything())
.on('postgres_changes',{event:'*',schema:'public',table:'reservas'},()=>loadEverything())
.on('postgres_changes',{event:'*',schema:'public',table:'eventos'},()=>loadEverything())
.subscribe();

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session?.user?.email===ADMIN_EMAIL){
    loginCard.style.display='none';
    showScreen('lists');
    await loadEverything();
  }
})();
</script>
</body>
</html>
